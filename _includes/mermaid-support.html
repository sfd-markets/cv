<style>
  .mermaid-scroll {
    margin: 1.5em 0;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 0.5rem;
  }

  .mermaid {
    display: inline-block;
    min-width: min(100%, 720px);
    text-align: center;
  }

  .mermaid-wide {
    min-width: 1100px;
  }

  .mermaid svg {
    display: block;
    margin: 0 auto;
    max-width: none;
    height: auto;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    mermaid.initialize({
      startOnLoad: false,
      theme: "neutral",
      securityLevel: "loose",
      themeVariables: {
        fontSize: "15px",
        fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
      },
      flowchart: {
        useMaxWidth: false,
        htmlLabels: true,
        nodeSpacing: 40,
        rankSpacing: 48,
        padding: 12
      }
    });

    document.querySelectorAll("code.language-mermaid").forEach(function (code) {
      var pre = code.closest("pre");
      if (!pre) return;

      var content = code.textContent.trim();
      var isWide = /^%%\s*wide\s*%%/m.test(content);
      if (isWide) {
        content = content.replace(/^%%\s*wide\s*%%\s*\n?/, "");
      }

      var scroll = document.createElement("div");
      scroll.className = "mermaid-scroll";

      var diagram = document.createElement("div");
      diagram.className = "mermaid" + (isWide ? " mermaid-wide" : "");
      diagram.textContent = content;

      scroll.appendChild(diagram);
      pre.replaceWith(scroll);
    });

    mermaid.run({ querySelector: ".mermaid" });
  });
</script>
